<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Bugs</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-weight: 600;
      color: #2c3e50;
    }

    .card {
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card-title {
      font-weight: 500;
      color: #34495e;
    }

    canvas {
      max-width: 100%;
      height: 300px;
    }

    @media (max-width: 768px) {
      canvas {
        height: 250px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Dashboard de Monitoramento de Bugs</h1>

    <div class="row g-3 mb-4 align-items-end justify-content-center">
      <div class="col-auto">
        <label for="startDate" class="form-label fw-bold">Data Início</label>
        <input type="date" class="form-control" id="startDate">
      </div>
      <div class="col-auto">
        <label for="endDate" class="form-label fw-bold">Data Fim</label>
        <input type="date" class="form-control" id="endDate">
      </div>
      <div class="col-auto">
        <button class="btn btn-primary px-4" onclick="updateCharts()">
          Filtrar
        </button>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Bugs ao Longo do Tempo</h5>
            <canvas id="bugsOverTime"></canvas>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Tempo para Correção (Dias)</h5>
            <canvas id="timeToFix"></canvas>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Principais Desenvolvedores</h5>
            <canvas id="topDevs"></canvas>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Arquivos Mais Modificados</h5>
            <canvas id="topFiles"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
